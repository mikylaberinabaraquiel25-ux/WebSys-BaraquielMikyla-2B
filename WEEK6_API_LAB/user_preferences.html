<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

        body.dark-mode { background-color: black; color: white; }
    </style>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- Header -->
    <header class="bg-dark text-white text-center py-4">
        <h1>API and Local Storage Laboratory</h1>
        <p>User Preferences Example</p>
    </header>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Home</a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="local_storage.html">Local Storage</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="user_preferences.html">User Preferences</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="weather_api.html">Weather API</a>

                    <li class="nav-item">

                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
   <main class="container my-5">
        <div class="card shadow">
            <div class="card-body">

                <h2>User Preferences</h2>

                <label class="form-label">Theme</label>
                    <select id="theme" class="form-select mb-3">
                        <option value="light">Light Mode</option>
                        <option value="dark">Dark Mode</option>
                </select>

                <label class="form-label">Language</label>
                    <select id="language" class="form-select mb-3">
                        <option value="en">English</option>
                        <option value="es">Spanish</option>
                </select>

                <button onclick="savePreferences()" class="btn btn-primary">Save Preferences</button>
                <p id="message"></p>
                <script>
                        function savePreferences() {
                            let theme = document.getElementById("theme").value;
                            let language = document.getElementById("language").value;
                            localStorage.setItem("userTheme", theme);
                            localStorage.setItem("userLanguage", language);
                            applyPreferences();
                            document.getElementById("message").innerText = "Preferences saved!";
                        }

                        function loadPreferences() {
                            let theme = localStorage.getItem("userTheme");
                            let language = localStorage.getItem("userLanguage");
                            if (theme) {
                                document.getElementById("theme").value = theme;
                            }
                            if (language) {
                                document.getElementById("language").value = language;
                            }
                            applyPreferences();
                        }

                        function applyPreferences() {
                            let savedTheme = localStorage.getItem("userTheme");
                            let savedLanguage = localStorage.getItem("userLanguage");

                            if (savedTheme === "dark") {
                            document.body.classList.add("dark-mode");
                            } else {
                            document.body.classList.remove("dark-mode");
                            }
                
                            document.getElementById("theme").value = savedTheme || "light";
                            document.getElementById("language").value = savedLanguage || "en";
                            }
                
                                applyPreferences();
                 </script>
                    
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3">

</body>
