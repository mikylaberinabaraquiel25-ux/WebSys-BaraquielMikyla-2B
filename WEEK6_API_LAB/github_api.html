<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather API Example</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- Header -->
    <header class="bg-dark text-white text-center py-4">
        <h1>API and Local Storage Laboratory</h1>
        <p>GitHub API Example</p>
    </header>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Home</a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="local_storage.html">Local Storage</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="user_preferences.html">User Preferences</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="weather_api.html">Weather API</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="map_api.html">Maps API</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="github_api.html">GitHub API</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container my-5">

        <div class="card shadow">
            <div class="card-body">

                <h2>GitHub User Lookup</h2>

               <input type="text" id="username" placeholder="Enter GitHub Username">
                <button onclick="getUser()">Get User</button>
                <div id="userResult"></div>
                <script>
                    function getUser() {
                        let username = document.getElementById("username").value;
                        let url = `https://api.github.com/users/${username}`;
                        
                        fetch(url)
                            .then(response => response.json())
                            .then(data => {
                            document.getElementById("userResult").innerHTML = `
                                <h3>${data.name || "No Name Found"}</h3>
                                <img src="${data.avatar_url}" width="100">
                                <p>Public Repos: ${data.public_repos}</p>
                                <p>Followers: ${data.followers}</p>
                                `;
                            })
                            .catch(error => console.error("Error fetching GitHub data:", error));
                    }       
                </script>
             </div>  
        </div>
    </main>    
    
            
    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">
            MIKYLA B. BARAQUIEL | BS Information Systems
        </p>
    </footer>

    <script>
        function saveData() {
            let name = document.getElementById("username").value;
            localStorage.setItem("userName", name);
            alert("Data Saved!");
        }

        function loadData() {
            let name = localStorage.getItem("userName");
            document.getElementById("display").innerText =
                name ? "Welcome, " + name : "No data saved!";
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
