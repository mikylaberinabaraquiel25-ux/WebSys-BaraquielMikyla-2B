<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather API Example</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- Header -->
    <header class="bg-dark text-white text-center py-4">
        <h1>API and Local Storage Laboratory</h1>
        <p>Weather API Example</p>
    </header>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Home</a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="local_storage.html">Local Storage</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="user_preferences.html">User Preferences</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="weather_api.html">Weather API</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="map_api.html">Maps API</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="github_api.html">GitHub API</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container my-5">
        <input type="text" id="city" value="Manila">
        <button onclick="getWeather()">Get Weather</button>

         <p id="weatherResult"></p>

    <script>
        function getWeather() {
            let city = document.getElementById("city").value;
            let apiKey = "94b32a2bf57e89d503234fd3518b6da9"; // Replace with your API key
            let url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;

            fetch(url)
             .then(response => response.json())
                .then(data => {
                    document.getElementById("weatherResult").innerHTML = `
                    <p>Temperature: ${data.main.temp}°C</p>
                    <img src="https://openweathermap.org/img/w/${data.weather[0].icon}.png">
                    <p>${data.weather[0].description}</p>
                    `;
                })
                 .catch(error => console.error("Error fetching weather data:", error));
        }               
    </script>

    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">
            MIKYLA B. BARAQUIEL | BS Information Systems
        </p>
    </footer>

    <script>
        function saveData() {
            let name = document.getElementById("username").value;
            localStorage.setItem("userName", name);
            alert("Data Saved!");
        }

        function loadData() {
            let name = localStorage.getItem("userName");
            document.getElementById("display").innerText =
                name ? "Welcome, " + name : "No data saved!";
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
