<html lang="en">

    </style>

    <!-- Bootstrap CSS -->

</head>
<body>

    <!-- Header -->
    <header class="bg-dark text-white text-center py-4">
        <h1>API and Local Storage Laboratory</h1>
        <p>Local Storage Example</p>
    </header>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Home</a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="local_storage.html">Local Storage</a>
                    </li>

                    <li class="nav-item">

                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container my-5">
    <h2>Save User Preferences</h2>
        <label for="username">Enter Name:</label>
        <input type="text" id="username">
        <button onclick="saveData()">Save</button>
        <button onclick="loadData()">Load</button>
        <p id="display"></p>
 
         <script>
            function saveData()
            {
                let name =document.getElementById("username").value;
                localStorage.setItem("userName", name);
                alert("Data Saved!");
            }
            function loadData()
            {
                let name = localStorage.getItem("userName");
                document.getElementById("display").innerText = name ? "Welcome, " + name : "No data saved!";
            }
        </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
